[package]
name = "delivery_bot_tracker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Dynamic obstacle detection and tracking with prediction (delivery_bot_core#11)"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "delivery_bot_tracker"
path = "src/lib.rs"

[[bin]]
name = "tracker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
nalgebra = "0.33"
rclrs = "0.8"
# Message crates generated by rosidl_generator_rs, found through AMENT_PREFIX_PATH.
ros-env = "0.3"
