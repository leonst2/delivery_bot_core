[package]
name = "delivery_bot_rust_hello"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust toolchain spike: rclrs node that listens to /clock and publishes heartbeats"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rclrs = "0.8"
# Message crates generated by rosidl_generator_rs, found through AMENT_PREFIX_PATH.
ros-env = "0.3"
