[package]
name = "delivery_bot_odometry"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Wheel and IMU odometry with its own EKF (delivery_bot_core#7)"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "odometry"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rclrs = "0.8"
# Message crates generated by rosidl_generator_rs, found through AMENT_PREFIX_PATH.
ros-env = "0.3"
