name: build

on:
  push:
  pull_request:

jobs:
  colcon:
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/delivery_bot_core
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Launch smoke test (sim:=true)
        shell: bash
        run: |
          source install/setup.bash
          ros2 launch delivery_bot_navigation bringup.launch.py sim:=true > launch.log 2>&1 &
          trap 'kill %1 || true; cat launch.log' EXIT
          set -x
          sleep 5
          ros2 node list --no-daemon
          ros2 topic list -t --no-daemon
          timeout 30 ros2 topic echo --once --qos-durability transient_local /grid_step/state std_msgs/msg/String
          timeout 30 ros2 topic echo --once --qos-durability transient_local /robot_description std_msgs/msg/String > /dev/null
          ros2 param get /grid_step_controller use_sim_time | grep -q True
          ros2 param get /grid_step_controller step_size | grep -q 0.5
